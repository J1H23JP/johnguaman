<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portafolio-John-Guaman</title>
    <meta
      name="description"
      content="Portafolio 3D interactivo de John Guaman: desarrollo de software, pruebas y aplicaciones con IA."
    />
    <meta name="theme-color" content="#070b1f" />
    <script>
      // Tema guardado, aplicado antes de pintar para evitar el parpadeo.
      (function () {
        try {
          var th = localStorage.getItem('theme');
          if (th === 'light') {
            document.documentElement.dataset.theme = 'light';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e9edfb');
          }
        } catch (e) {}
      })();
    </script>
    <meta property="og:title" content="Portafolio-John-Guaman" />
    <meta
      property="og:description"
      content="Gira el cristal, corrige los defectos y recorre mis proyectos en 3D."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://j1h23jp.github.io/johnguaman/" />
    <meta property="og:image" content="https://j1h23jp.github.io/johnguaman/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip" href="#contenido">Saltar al contenido</a>

    <canvas id="gl" aria-hidden="true"></canvas>

    <div id="loader" role="status" aria-live="polite">
      <div class="loader__mark" aria-hidden="true"></div>
      <p class="loader__text">Calibrando el laboratorio</p>
    </div>

    <header class="bar" id="bar"></header>
    <nav class="rail" id="rail" aria-label="Secciones"></nav>

    <main id="contenido"></main>

    <aside class="hud hud--defects" id="hud-defects" aria-live="polite"></aside>
    <aside class="hud hud--project" id="hud-project"></aside>
    <aside class="hud hud--skill" id="hud-skill" aria-live="polite"></aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="cursor" id="cursor" aria-hidden="true"></div>

    <noscript>
      <p class="noscript">
        Este portafolio necesita JavaScript para mostrar la escena 3D. Mi GitHub:
        <a href="https://github.com/J1H23JP">github.com/J1H23JP</a>
      </p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
